name: Snapshot tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  snapshots:
    name: Snapshots on iOS 26.2
    runs-on: macos-26
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-snapshots-ios26
      cancel-in-progress: true
    steps:
      - name: Install tools
        run: brew update && brew upgrade xcbeautify

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout maplibre-swiftui-dsl-playground
        uses: actions/checkout@v4

      - name: Disable SPM Prebuilts
        run: defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts NO

      - name: Test image snapshots in the host app
        run: xcodebuild -project SnapshotTests/SnapshotHost.xcodeproj -scheme SnapshotHost test -skipMacroValidation -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' | xcbeautify && exit "${PIPESTATUS[0]}"
