name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  snapshots:
    runs-on: macos-26
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-snapshots-ios26
      cancel-in-progress: true
    strategy:
      matrix:
        destination: ["platform=iOS Simulator,name=iPhone 17,OS=26.2"]
    name: Snapshots on ${{ matrix.destination }}

    steps:
      - name: Install tools
        run: brew update && brew upgrade xcbeautify

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Checkout maplibre-swiftui-dsl-playground
        uses: actions/checkout@v4

      - name: Disable SPM Prebuilts
        run: defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts NO

      - name: Test image snapshots in the host app
        run: |
          mkdir -p '${{ runner.temp }}/snapshot-test-results'
          xcodebuild -project SnapshotTests/SnapshotHost.xcodeproj -scheme SnapshotHost test -skipMacroValidation -destination '${{ matrix.destination }}' -resultBundlePath '${{ runner.temp }}/snapshot-test-results/SnapshotHost.xcresult' | xcbeautify && exit "${PIPESTATUS[0]}"

      - name: Upload snapshot test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-test-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/snapshot-test-results/
